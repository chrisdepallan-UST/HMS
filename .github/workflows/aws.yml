# Build the Docker image, push it to Amazon ECR, then deploy it on an EC2
# instance over SSH. Triggered on every push to "main".
#
# -----------------------------------------------------------------------------
# One-time setup
# -----------------------------------------------------------------------------
# 1. Create an ECR repository:
#      aws ecr create-repository --repository-name hms --region us-east-2
#
# 2. On the EC2 instance:
#      - Install Docker and the AWS CLI v2.
#      - Attach an IAM role to the instance with ECR pull permissions
#        (managed policy: AmazonEC2ContainerRegistryReadOnly).
#      - Open the security group port you expose below (80).
#
# 3. Add these GitHub repository secrets
#    (Settings -> Secrets and variables -> Actions):
#      AWS_ACCESS_KEY_ID      IAM user key used by the workflow to push to ECR
#      AWS_SECRET_ACCESS_KEY  ...matching secret
#      EC2_HOST               Public IP / DNS of the EC2 instance
#      EC2_USER               SSH user (e.g. "ec2-user" or "ubuntu")
#      EC2_SSH_KEY            Private SSH key (full PEM contents) for that user
#      MONGO_URI              MongoDB Atlas connection string
#      JWT_SECRET             App JWT signing secret
#      JWT_EXPIRES_IN         e.g. "5d"
#      BREVO_API_KEY          Brevo email API key
#      EMAIL_USER             Sender email address
#      FRONTEND_URL           Allowed CORS origin (frontend URL)
# -----------------------------------------------------------------------------

name: Deploy to Amazon EC2

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: my-ecr-repo
  CONTAINER_NAME: hms
  # Host port published on the EC2 instance -> container's port 5000.
  HOST_PORT: 80

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,AWS_REGION,CONTAINER_NAME,HOST_PORT,MONGO_URI,JWT_SECRET,JWT_EXPIRES_IN,BREVO_API_KEY,EMAIL_USER,FRONTEND_URL
          script: |
            set -euo pipefail

            # Authenticate the instance to ECR using its IAM role.
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "${IMAGE%%/*}"

            docker pull "$IMAGE"

            # Seed the database (idempotent: existing records are skipped).
            docker run --rm \
              -e MONGO_URI="$MONGO_URI" \
              "$IMAGE" npm run seed:all

            # Replace the running container with the new image.
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${HOST_PORT}:5000" \
              -e PORT=5000 \
              -e NODE_ENV=production \
              -e MONGO_URI="$MONGO_URI" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_EXPIRES_IN="$JWT_EXPIRES_IN" \
              -e BREVO_API_KEY="$BREVO_API_KEY" \
              -e EMAIL_USER="$EMAIL_USER" \
              -e FRONTEND_URL="$FRONTEND_URL" \
              "$IMAGE"

            # Reclaim disk from older images.
            docker image prune -f
